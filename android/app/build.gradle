apply plugin: 'com.android.application'
apply plugin: 'com.metova.android'
apply plugin: 'crashlytics'

android {
    compileSdkVersion 21
    buildToolsVersion '21.1.2'

    defaultConfig {
        minSdkVersion 15
        targetSdkVersion 21
        versionCode 29
        versionName '1.1.1'
        testInstrumentationRunner 'com.sportsbeep.app.test.InstrumentationTestRunner'
        resConfig "en"
        resConfigs "nodpi", "mdpi", "hdpi", "xhdpi", "xxhdpi", "xxxhdpi"
    }

    signingConfigs {
        release {
            storeFile file("keystore.jks")
            storePassword "jUyu4TucEs33amUd"
            keyAlias "sportsbeep"
            keyPassword "Spuxajes8Kage6h7"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
            signingConfig signingConfigs.release
        }
    }

    productFlavors {
        integration {
            applicationId 'com.sportsbeep.app.integration'
        }
        staging {
            applicationId 'com.sportsbeep.app.staging'
        }
        production {
            applicationId 'com.sportsbeep.app'
        }
    }

    packagingOptions {
        exclude 'META-INF/services/javax.annotation.processing.Processor'
        exclude 'LICENSE'
        exclude 'NOTICE'
    }

    lintOptions {
        abortOnError false
    }
}

repositories {
    maven { url 'http://repo.metova.com/nexus/content/groups/public' }
    maven { url 'http://download.crashlytics.com/maven' }
}

dependencies {
    compile 'com.metova:slim:1.0'
    compile 'com.jakewharton:butterknife:5.1.2'
    compile 'com.squareup.retrofit:retrofit:1.6.1'
    compile 'com.squareup.okhttp:okhttp:1.6.0'
    compile 'com.squareup.okhttp:okhttp-urlconnection:1.6.0'
    compile 'com.j256.ormlite:ormlite-android:4.48'
    compile 'com.android.support:support-v4:21.0.3'
    compile 'com.squareup.dagger:dagger:1.2.2'
    compile 'com.squareup.dagger:dagger-compiler:1.2.2'
    compile 'com.squareup:otto:1.3.5'
    compile 'com.sothree.slidinguppanel:slidinguppanel:1.0@aar'
    compile 'com.google.android.gms:play-services:6.1.71' // Bug with 6.5.87 periodically freezes the app
    compile 'com.squareup.picasso:picasso:2.3.3'
    compile 'com.crashlytics.android:crashlytics:1.1.13'
    androidTestCompile 'com.jayway.android.robotium:robotium-solo:5.2.1'
    androidTestCompile 'org.mockito:mockito-core:1.9.5'
    androidTestCompile 'com.google.dexmaker:dexmaker:1.1'
    androidTestCompile 'com.google.dexmaker:dexmaker-mockito:1.1'
}
