<div class="ticket-roster">
  <div class="sidebar">
    <h1>Build a team</h1>
    <game-card sb-game="game" sb-include-start-time="true">
    </game-card>
    <ul id="game-positions">
      <li ng-repeat="gamePosition in gamePositions" ui-sref="gameShow.players({ position: gamePosition.id })">{{gamePosition.name}}</span>
      <li ng-repeat="ticketSquad in ticketSquads" ng-click="selectSquad(ticketSquad, game)">{{ticketSquad.name}} Squad</span>
    </ul>
  </div>
  <mobile-game-card sb-game="game">
  </mobile-game-card>
  <div ui-view="content" class="players">
  </div>
</div>
