<div class="best-and-bust">
  <header>Scoring Breakdown</header>
  <ul>
    <li ng-repeat="answer in answers">
      <div class="answer-details">
        <strong class="question-type">{{ answer.question.type }} Question</strong>
        <p class="question">
          {{ answer.question.text }}
        </p>
        <strong>Your Answer</strong>
        <span class="correctness" ng-class="{ 'correct': answer.correct, 'incorrect': !answer.correct }">
          <i class="fa" ng-class="{ 'fa-check': answer.correct, 'fa-times': !answer.correct }"></i> {{ answer.correct && "Correct" || "Incorrect" }}
        </span>
        <div class="answer">
          {{ answer.team.market }} {{ answer.team.name }} <em>in {{ answer.time }} seconds</em>
        </div>
      </div>
      <div class="points">
        <div class="value">{{ answer.score }}</div>
        <div class="points-text">Points</div>
      </div>
      <div class="clearfix">
    </li>
  </ul>
</div>
